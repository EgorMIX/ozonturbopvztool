# Статическая проверка расширения (scripts/check.mjs) на каждый push в main и pull request.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm run check:strict
        run: node scripts/check.mjs --strict
